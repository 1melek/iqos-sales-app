name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer les dépendances
        run: npm install
      - name: Préparer le projet Android
        run: |
          npm run build:www
          [ -d android ] || npx cap add android
          npx cap sync android
          node scripts/patch-android.js
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sales-expert.apk
      - name: Joindre l'APK au build
        uses: actions/upload-artifact@v4
        with:
          name: sales-expert-apk
          path: sales-expert.apk
      - name: Publier l'APK (dernière version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK Sales Expert (dernière version)
          body: "APK construit automatiquement depuis la branche main. Télécharge sales-expert.apk et installe-le sur Android (autoriser les sources inconnues)."
          prerelease: true
          files: sales-expert.apk
